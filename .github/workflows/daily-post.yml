name: Daily post
on:
  schedule:
  # 09:00 UTC every day. GitHub Actions cron is always UTC.
  - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the next row without posting it
        type: boolean
        default: false
      repair_titles:
        description: Title the annotations of links that are already posted
        type: boolean
        default: false
permissions:
  contents: write
# Never let two runs publish the same row at once.
concurrency:
  group: daily-post
  cancel-in-progress: false
jobs:
  post:
    name: Post the next queued link
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Title the annotations of links already posted
      if: inputs.repair_titles
      env:
        HYPOTHESIS_API_TOKEN: ${{ secrets.HYPOTHESIS_API_TOKEN }}
        HYPOTHESIS_API_URL: ${{ vars.HYPOTHESIS_API_URL }}
      run: python .github/scripts/post_links.py --csv data/posts.csv --repair-titles ${{ inputs.dry_run && '--dry-run' || '' }}
    - name: Post one row from data/posts.csv
      if: ${{ !inputs.repair_titles }}
      env:
        POST_TARGET: ${{ vars.POST_TARGET || 'hypothesis' }}
        HYPOTHESIS_API_TOKEN: ${{ secrets.HYPOTHESIS_API_TOKEN }}
        HYPOTHESIS_GROUP_ID: ${{ vars.HYPOTHESIS_GROUP_ID }}
        HYPOTHESIS_API_URL: ${{ vars.HYPOTHESIS_API_URL }}
      run: python .github/scripts/post_links.py --csv data/posts.csv --limit 1 ${{ inputs.dry_run && '--dry-run' || '' }}
    - name: Commit the updated queue
      run: |
        if git diff --quiet -- data/posts.csv; then
          echo "Nothing to commit."
          exit 0
        fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add data/posts.csv
        git commit -m 'chore: mark published link as posted'
        git push
